<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Practice</title>
</head>
<body style="background-color: black; color: white;">
    <ul class="language">
        <li>JavaScript</li>
        <li>Java</li>
        <li>Python</li>
        <li>C++</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const myListItem=document.createElement('li');
        myListItem.innerHTML=`${langName}`
        document.querySelector('.language').appendChild(myListItem)
    }
    addLanguage("Ruby")
    // This is easy to add single element but this can be optimised for multiple

    function createOptiLanguage(langName){
        const myListItem=document.createElement('li');
        myListItem.append(document.createTextNode(langName))
        document.querySelector('.language').appendChild(myListItem)
    }
    createOptiLanguage("GoLang")

    // Instead of traversing entire DOM using innerHTML we can simply use append functionality
    // Edit
    const secondLanguage=document.querySelector('li:nth-child(2)');
    const newListItem=document.createElement('li');
    newListItem.textContent='Mojo'
    secondLanguage.replaceWith(newListItem)

    // Edit Custom

    const firstLanguage=document.querySelector('li:nth-child(1)');
    firstLanguage.outerHTML="<li>Typescript</li>"
    
    // Delete Element
    const lastLanguage=document.querySelector('li:last-child')
    lastLanguage.remove()
</script>
</html>
